<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #1e3a5f;
            --navy-light: #2d4a6f;
            --blue-accent: #3b82f6;
            --bg-gray: #f5f7fa;
            --border-gray: #e2e8f0;
            --text-gray: #64748b;
        }

        html, body {
            background: #f5f7fa !important;
            font-family: 'Noto Sans KR', sans-serif;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .slide-container {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            text-align: center;
            position: relative;
            background: #f5f7fa;
            padding: 60px;
        }

        .slide.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 공통 카드 스타일 ========== */
        .card {
            background: white;
            border-radius: 24px;
            padding: 60px 80px;
            box-shadow: 0 4px 20px rgba(30, 58, 95, 0.08);
        }

        .card-large {
            padding: 80px 120px;
        }

        .tag {
            display: inline-block;
            background: var(--bg-gray);
            color: var(--navy);
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .title-main {
            font-size: 6rem;
            font-weight: 900;
            color: var(--navy);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .title-sub {
            font-size: 2rem;
            color: var(--text-gray);
            font-weight: 500;
        }

        /* ========== 슬라이드 1: D-Day ========== */
        .dday-number {
            font-size: 18rem;
            font-weight: 900;
            color: var(--navy);
            line-height: 1;
            margin: 20px 0;
            position: relative;
        }

        .dday-number::after {
            content: '';
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 6px;
            background: var(--blue-accent);
            border-radius: 3px;
        }

        .exam-date {
            font-size: 2.2rem;
            color: var(--text-gray);
            margin-top: 30px;
        }

        /* ========== 슬라이드 2: 현재시각 ========== */
        .clock-display {
            font-size: 14rem;
            font-weight: 900;
            color: var(--navy);
            font-family: 'SF Mono', 'Cascadia Code', 'Noto Sans KR', monospace;
            letter-spacing: 0.02em;
            line-height: 1;
        }

        .period-badge {
            display: inline-block;
            background: var(--navy);
            color: white;
            padding: 16px 48px;
            border-radius: 50px;
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: 40px;
        }

        /* ========== 슬라이드 3,4,5: 메시지 카드 ========== */
        .message-icon {
            font-size: 5rem;
            margin-bottom: 30px;
        }

        .message-main {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--navy);
            line-height: 1.4;
            margin-bottom: 40px;
            word-break: keep-all;
        }

        .message-sub {
            font-size: 2rem;
            color: var(--text-gray);
            font-weight: 500;
            line-height: 1.8;
        }

        .message-box {
            display: inline-block;
            border: 2px solid var(--border-gray);
            border-radius: 16px;
            padding: 20px 40px;
            margin: 10px;
            font-size: 1.8rem;
            color: var(--navy);
            font-weight: 500;
        }

        .message-boxes {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ========== 슬라이드 인디케이터 ========== */
        .slide-indicator {
            position: absolute;
            bottom: 40px;
            right: 50px;
            font-size: 1.4rem;
            color: var(--text-gray);
            background: white;
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid var(--border-gray);
        }

        /* ========== 프로그레스 바 ========== */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--blue-accent);
            animation: progress 10s linear infinite;
        }

        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }

        /* ========== 반응형 ========== */
        @media (max-width: 1200px) {
            .dday-number { font-size: 14rem; }
            .clock-display { font-size: 10rem; }
            .title-main { font-size: 4.5rem; }
            .message-main { font-size: 3.5rem; }
            .card { padding: 50px 60px; }
        }

        @media (max-width: 768px) {
            .dday-number { font-size: 10rem; }
            .clock-display { font-size: 7rem; }
            .title-main { font-size: 3.5rem; }
            .message-main { font-size: 2.8rem; }
            .card { padding: 40px; }
            .tag { font-size: 1.2rem; }
            .message-box { font-size: 1.4rem; padding: 15px 25px; }
        }
    </style>
</head>

                    tip1: "🛋️ 적당한 휴식 취하기",
                    tip2: "🌙 일찍 잠자리에 들기"
                },
                cheer: {
                    tag: "일요일 응원",
                    main: "쉼 없이 달려온 당신,<br>정말 자랑스러워요",
                    tip1: "💝 오늘의 나에게 감사하기",
                    tip2: "🌈 내일은 더 좋은 날이 될 거예요"
                }
            }
        };

        // 유틸리티 함수들
        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function getCurrentPeriod() {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            for (let i = 0; i < schedule.length; i++) {
                const period = schedule[i];
                const startMinutes = timeToMinutes(period.start);
                let endMinutes = startMinutes + period.duration;

                if (endMinutes >= 24 * 60) {
                    endMinutes = endMinutes - 24 * 60;
                    if (currentMinutes >= startMinutes || currentMinutes < endMinutes) {
                        return period;
                    }
                } else {
                    if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                        return period;
                    }
                }
            }

            return { name: "자습시간", type: "study" };
        }

        function getTimeUntilNext() {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            for (let i = 0; i < schedule.length; i++) {
                const period = schedule[i];
                const startMinutes = timeToMinutes(period.start);
                let endMinutes = startMinutes + period.duration;

                if (endMinutes >= 24 * 60) {
                    endMinutes = endMinutes - 24 * 60;
                    if (currentMinutes >= startMinutes || currentMinutes < endMinutes) {
                        const nextPeriod = schedule[(i + 1) % schedule.length];
                        let remainingMinutes;
                        if (currentMinutes >= startMinutes) {
                            remainingMinutes = (24 * 60) - currentMinutes + endMinutes;
                        } else {
                            remainingMinutes = endMinutes - currentMinutes;
                        }
                        return `${nextPeriod.name}까지 ${remainingMinutes}분 남음`;
                    }
                } else {
                    if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                        const remainingMinutes = endMinutes - currentMinutes;
                        const nextPeriod = schedule[(i + 1) % schedule.length];
                        return `${nextPeriod.name}까지 ${remainingMinutes}분 남음`;
                    }
                }
            }

            const nextPeriod = schedule.find(p => timeToMinutes(p.start) > currentMinutes) || schedule[0];
            const nextStart = timeToMinutes(nextPeriod.start);
            const timeUntil = nextStart > currentMinutes ? nextStart - currentMinutes : (24 * 60) - currentMinutes + nextStart;

            return `${nextPeriod.name}까지 ${timeUntil}분 남음`;
        }

        // D-Day 계산 함수
        function calculateDDay() {
            const today = new Date();
            const suneungDate = new Date('2026-11-19');

            today.setHours(0, 0, 0, 0);
            suneungDate.setHours(0, 0, 0, 0);

            const timeDiff = suneungDate.getTime() - today.getTime();
            const daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));

            return daysDiff;
        }

        // 요일별 메시지 업데이트 함수
        function updateWeeklyMessages() {
            const today = new Date();
            const dayOfWeek = today.getDay();
            const messages = weeklyMessages[dayOfWeek];

            if (messages) {
                // 슬라이드 3: 공부 전략
                document.getElementById('study-tag').textContent = messages.study.tag;
                document.getElementById('study-main').innerHTML = messages.study.main;
                document.getElementById('study-tip1').textContent = messages.study.tip1;
                document.getElementById('study-tip2').textContent = messages.study.tip2;

                // 슬라이드 4: 건강 관리
                document.getElementById('health-tag').textContent = messages.health.tag;
                document.getElementById('health-main').innerHTML = messages.health.main;
                document.getElementById('health-tip1').textContent = messages.health.tip1;
                document.getElementById('health-tip2').textContent = messages.health.tip2;

                // 슬라이드 5: 응원 메시지
                document.getElementById('cheer-tag').textContent = messages.cheer.tag;
                document.getElementById('cheer-main').innerHTML = messages.cheer.main;
                document.getElementById('cheer-tip1').textContent = messages.cheer.tip1;
                document.getElementById('cheer-tip2').textContent = messages.cheer.tip2;
            }
        }

        // 슬라이드 관련 함수들
        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            if (slides[index]) {
                slides[index].classList.add('active');
            }
        }

        function nextSlide() {
            const currentPeriod = getCurrentPeriod();
            if (currentPeriod.type === "break" || currentPeriod.type === "meal") {
                slideIndex = (slideIndex + 1) % totalSlides;
                showSlide(slideIndex);
            }
        }

        // 메인 업데이트 함수
        function updateAll() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ko-KR', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            const currentPeriod = getCurrentPeriod();

            // 시계 업데이트
            const bigClock = document.getElementById('big-clock');
            const currentTimeElement = document.getElementById('current-time');
            const periodText = document.getElementById('period-text');
            const currentPeriodElement = document.getElementById('current-period');

            if (bigClock) bigClock.textContent = timeString;
            if (currentTimeElement) currentTimeElement.textContent = timeString;
            if (periodText) periodText.textContent = currentPeriod.name;
            if (currentPeriodElement) currentPeriodElement.textContent = currentPeriod.name;

            // 화면 모드 전환
            const studyBackground = document.getElementById('study-background');
            const slideContainer = document.getElementById('slide-container');

            if (currentPeriod.type === "class" || currentPeriod.type === "study") {
                if (studyBackground) studyBackground.style.display = 'block';
                if (slideContainer) slideContainer.style.display = 'none';
            } else {
                if (studyBackground) studyBackground.style.display = 'none';
                if (slideContainer) slideContainer.style.display = 'flex';
            }
        }

        // 카운트다운 업데이트
        function updateCountdown() {
            const days = calculateDDay();
            const countdownElement = document.getElementById('countdown');

            if (countdownElement) {
                if (days > 0) {
                    countdownElement.textContent = `D-${days}`;
                } else if (days === 0) {
                    countdownElement.textContent = 'D-DAY';
                }
            }
        }

        // 자정 업데이트 스케줄링
        function scheduleNextUpdate() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 1, 0);

            const msUntilMidnight = tomorrow.getTime() - now.getTime();

            setTimeout(() => {
                updateCountdown();
                updateWeeklyMessages();
                scheduleNextUpdate();
            }, msUntilMidnight);
        }

        // 초기화
        function initialize() {
            updateAll();
            updateCountdown();
            updateWeeklyMessages();

            setInterval(updateAll, 1000);
            setInterval(nextSlide, 10000);
            setInterval(updateCountdown, 60000);

            scheduleNextUpdate();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                updateAll();
                updateCountdown();
                updateWeeklyMessages();
            }
        });
    </script>
</body>
</html>
